name: HA Relapse
version: "0.4.11"
slug: relapse_local
description: Local Relapse web host and PS5-only DNS for firmware 13.60
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
stage: experimental
ports:
  1053/udp: 53
  1053/tcp: 53
  8080/tcp: 8088
  8443/tcp: 443
ports_description:
  1053/udp: PS5 DNS
  1053/tcp: PS5 DNS over TCP
  8080/tcp: Local HTTP (use host port 80 for connectivity checks; free it first)
  8443/tcp: HTTPS User's Guide entry
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:gamepad-variant
panel_title: HA Relapse
panel_admin: true
watchdog: http://[HOST]:[PORT:8080]/health
options:
  server_ip: ""
schema:
  server_ip: str
  nanodns_ip: "str?"
